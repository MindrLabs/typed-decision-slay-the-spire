    max_head_length: 320
    fast: false
    preload: false
    max_concurrent_count: 1
    runtime:
      type: virtualenv
      path: .runtime/laya-typed
    action: *action

  - id: laya-multilingual
    type: model
    task: typed-decision
    driver: custom
    family: laya
    preset: multilingual
    max_seq_length: 4096
    max_head_length: 320
    fast: false
    preload: false
    max_concurrent_count: 1
    runtime:
      type: virtualenv
      path: .runtime/laya-multilingual
    action: *action

  - id: laya-english-ft
    type: model
    task: typed-decision
    driver: custom
    family: laya
    preset: english
    model:
      provider: huggingface
      repository: MindrLabs/sts-arena-laya-english-ft
    max_head_length: 320
    fast: false
    preload: false
    max_concurrent_count: 1
    runtime:
      type: virtualenv
      path: .runtime/laya-english-ft
    action: *action


  - id: laya-english-ft4
    type: model
    task: typed-decision
    driver: custom
    family: laya
    preset: english
    model:
      provider: huggingface
      repository: MindrLabs/sts-arena-laya-english-ft4
    max_head_length: 320
    fast: false
    preload: false
    max_concurrent_count: 1
    runtime:
      type: virtualenv
      path: .runtime/laya-english-ft4
    action: *action
  - id: laya-english-rec
    type: model
    task: typed-decision
    driver: custom
    family: laya
    preset: english
    max_seq_length: 1024
    max_head_length: 512
    fast: false
    preload: false
    max_concurrent_count: 1
    runtime:
      type: virtualenv
      path: .runtime/laya-english-rec
