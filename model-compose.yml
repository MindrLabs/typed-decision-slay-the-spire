controller:
  adapter:
    type: http-server
    port: ${env.PORT | 8080}
    base_path: /api
  webui:
    driver: gradio
    port: ${env.SERVER_PORT | 8081}

# One workflow per contestant, named as the runner's --player. Models load on their first request,
# so only the ones a run asks for take memory.
workflows:
  - id: nimble
    title: Bespoke Nimble-9B
    description: Zero-shot typed decision (round 1).
    job: { component: nimble, input: "${input}", output: "${output as json}" }

  - id: laya-english
    title: Laya english
    description: Zero-shot typed decision (round 1).
    job: { component: laya-english, input: "${input}", output: "${output as json}" }

  - id: laya-typed
    title: Laya typed-decisions
    description: Zero-shot typed decision (round 1).
    job: { component: laya-typed, input: "${input}", output: "${output as json}" }

  - id: laya-multilingual
    title: Laya multilingual
    description: Zero-shot typed decision (round 1).
    job: { component: laya-multilingual, input: "${input}", output: "${output as json}" }

  - id: nimble-ft
    title: Bespoke Nimble-9B, fine-tuned
    description: Fine-tuned once on heart1's decisions (round 2).
    job: { component: nimble-ft, input: "${input}", output: "${output as json}" }


  - id: nimble-ft4
    title: Bespoke Nimble-9B, fine-tuned for the potion round
    description: Round 2's adapter trained further with the potion step and heart1's search visits (docs/potion-round.md). Play it with --potion-step.
    job: { component: nimble-ft4, input: "${input}", output: "${output as json}" }
  - id: laya-english-ft
    title: Laya english, fine-tuned
    description: Fine-tuned once on heart1's decisions (round 2).
    job: { component: laya-english-ft, input: "${input}", output: "${output as json}" }


  - id: laya-english-ft4
    title: Laya english, fine-tuned for the potion round
    description: Round 2's checkpoint trained further with the potion step and heart1's search visits (docs/potion-round.md). Play it with --potion-step.
    job: { component: laya-english-ft4, input: "${input}", output: "${output as json}" }
  - id: laya-english-rec
    title: Laya english, documented format
    description: Larger input budget for Convai's documented format (exploratory, docs/plan-laya-format.md).
    job: { component: laya-english-rec, input: "${input}", output: "${output as json}" }

  - id: laya-typed-rec
    title: Laya typed-decisions, documented format
    description: Larger input budget for Convai's documented format (exploratory, docs/plan-laya-format.md).
    job: { component: laya-typed-rec, input: "${input}", output: "${output as json}" }

  - id: laya-multilingual-rec
    title: Laya multilingual, documented format
    description: Larger input budget for Convai's documented format (exploratory, docs/plan-laya-format.md).
    job: { component: laya-multilingual-rec, input: "${input}", output: "${output as json}" }

  - id: laya-english-ft-rec
    title: Laya english, fine-tuned, documented format
    description: Larger input budget for Convai's documented format (exploratory, docs/plan-laya-format.md).
    job: { component: laya-english-ft-rec, input: "${input}", output: "${output as json}" }

components:
  - id: nimble
    type: model
    task: typed-decision
    driver: custom
    family: nimble
    model:
      provider: huggingface
      repository: bespokelabs/Bespoke-Nimble-9B
      revision: bd792f44ec8e265be861bfcdf4e05967ffe0e858
    base_model:
      provider: huggingface
      repository: Qwen/Qwen3.5-9B
      revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
    max_seq_length: 4096
    precision: bfloat16
    preload: false
    max_concurrent_count: 1
    runtime:
      type: virtualenv
      path: .runtime/nimble
    action: &action
      text: ${input.text as text}
      schema: ${input.schema as json}
      return_probabilities: true

  - id: nimble-ft
    type: model
    task: typed-decision
    driver: custom
    family: nimble
    model:
      provider: huggingface
      repository: MindrLabs/sts-arena-nimble-ft
    base_model:
      provider: huggingface
      repository: Qwen/Qwen3.5-9B
      revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
    max_seq_length: 4096
    precision: bfloat16
    preload: false
    max_concurrent_count: 1
    runtime:
      type: virtualenv
      path: .runtime/nimble-ft
    action: *action


  - id: nimble-ft4
    type: model
    task: typed-decision
    driver: custom
    family: nimble
    model:
      provider: huggingface
      repository: MindrLabs/sts-arena-nimble-ft4
    base_model:
      provider: huggingface
      repository: Qwen/Qwen3.5-9B
      revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
    max_seq_length: 4096
    precision: bfloat16
    preload: false
    max_concurrent_count: 1
    runtime:
      type: virtualenv
      path: .runtime/nimble-ft4
    action: *action
  - id: laya-english
    type: model
    task: typed-decision
    driver: custom
    family: laya
    preset: english
    max_head_length: 320
    fast: false
    preload: false
    max_concurrent_count: 1
