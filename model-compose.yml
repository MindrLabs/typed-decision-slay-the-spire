  - id: laya-multilingual-rec
    type: model
    task: typed-decision
    driver: custom
    family: laya
    preset: multilingual
    max_seq_length: 4096
    max_head_length: 512
    fast: false
    preload: false
    max_concurrent_count: 1
    runtime:
      type: virtualenv
      path: .runtime/laya-multilingual-rec
    action: *action

  - id: laya-english-ft-rec
    type: model
    task: typed-decision
    driver: custom
