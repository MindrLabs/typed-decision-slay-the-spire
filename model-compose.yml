  - id: laya-typed-rec
    type: model
    task: typed-decision
    driver: custom
    family: laya
    preset: typed-decisions
    max_seq_length: 1024
    max_head_length: 512
    fast: false
    preload: false
    max_concurrent_count: 1
    runtime:
